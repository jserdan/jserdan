<svg width="1200" height="300" viewBox="0 0 1200 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#062D22"/>
      <stop offset="55%" stop-color="#0B4A36"/>
      <stop offset="100%" stop-color="#174F3A"/>
    </linearGradient>

    <!-- Main wave -->
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7FAF79" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#A8D58D" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#8FBE7C" stop-opacity="0.58"/>
    </linearGradient>

    <!-- Secondary wave -->
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3F8C69" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#75B982" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#A4D18A" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Thin accent -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8FBFA4" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#D5E7A8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8FBFA4" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Subtle glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <!-- Dot pattern -->
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3"
              fill="#8FBFA4"
              opacity="0.35"/>
    </pattern>

    <clipPath id="clip">
      <rect width="1200" height="300" rx="22"/>
    </clipPath>

  </defs>


  <!-- Background -->
  <rect width="1200" height="300"
        rx="22"
        fill="url(#bg)"/>


  <!-- Decorative dot clusters -->
  <rect x="25" y="25"
        width="90"
        height="70"
        fill="url(#dots)"
        opacity="0.7"/>

  <rect x="1080" y="35"
        width="90"
        height="70"
        fill="url(#dots)"
        opacity="0.55"/>

  <rect x="1050" y="220"
        width="110"
        height="55"
        fill="url(#dots)"
        opacity="0.45"/>


  <!-- Floating decorative circles -->
  <g fill="none"
     stroke="#8FBFA4"
     stroke-width="1.5"
     opacity="0.55">

    <circle cx="58" cy="155" r="8">
      <animate
        attributeName="opacity"
        values="0.25;0.7;0.25"
        dur="4s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="1080" cy="145" r="6">
      <animate
        attributeName="opacity"
        values="0.2;0.65;0.2"
        dur="3.5s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="960" cy="205" r="5">
      <animate
        attributeName="opacity"
        values="0.2;0.7;0.2"
        dur="4.5s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="290" cy="215" r="5">
      <animate
        attributeName="opacity"
        values="0.15;0.6;0.15"
        dur="5s"
        repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- Soft glow behind waves -->
  <path
    d="M-50 245
       C120 170 210 285 390 245
       C570 205 610 170 790 215
       C965 260 1030 155 1250 125
       L1250 330
       L-50 330 Z"
    fill="#7DB77A"
    opacity="0.12"
    filter="url(#glow)">
    
    <animateTransform
      attributeName="transform"
      type="translate"
      values="-15 0;15 0;-15 0"
      dur="12s"
      repeatCount="indefinite"/>
  </path>


  <!-- Back wave -->
  <path
    d="M-50 230
       C120 155 220 280 390 235
       C555 192 635 165 800 215
       C970 265 1040 155 1250 120
       L1250 330
       L-50 330 Z"
    fill="url(#wave2)">

    <animateTransform
      attributeName="transform"
      type="translate"
      values="-12 0;12 0;-12 0"
      dur="14s"
      repeatCount="indefinite"/>
  </path>


  <!-- Main flowing wave -->
  <path
    d="M-50 245
       C115 165 205 285 385 250
       C560 215 635 165 805 215
       C975 265 1040 155 1250 125
       L1250 330
       L-50 330 Z"
    fill="url(#wave1)">

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;-18 2;0 0;18 -2;0 0"
      dur="16s"
      repeatCount="indefinite"/>
  </path>


  <!-- Dark wave overlay -->
  <path
    d="M-50 275
       C130 205 215 305 405 270
       C590 235 670 205 830 250
       C1010 300 1080 205 1250 170
       L1250 330
       L-50 330 Z"
    fill="#0A4935"
    opacity="0.45">

    <animateTransform
      attributeName="transform"
      type="translate"
      values="10 0;-10 0;10 0"
      dur="18s"
      repeatCount="indefinite"/>
  </path>


  <!-- Thin wave lines -->
  <g fill="none"
     stroke="#8FBFA4"
     stroke-width="1.2"
     opacity="0.32">

    <path d="M-30 235
             C150 155 230 275 410 235
             C590 195 660 160 820 210
             C990 260 1080 155 1230 130">

      <animateTransform
        attributeName="transform"
        type="translate"
        values="-10 0;10 0;-10 0"
        dur="11s"
        repeatCount="indefinite"/>
    </path>

    <path d="M-30 265
             C150 185 230 300 420 260
             C600 220 680 185 835 235
             C1000 285 1080 185 1230 155">

      <animateTransform
        attributeName="transform"
        type="translate"
        values="12 0;-12 0;12 0"
        dur="13s"
        repeatCount="indefinite"/>
    </path>

  </g>


  <!-- Golden/cream accent line -->
  <path
    d="M-20 247
       C120 177 210 282 390 248
       C560 216 640 174 805 217
       C970 260 1040 160 1220 130"
    fill="none"
    stroke="url(#accent)"
    stroke-width="2.5"
    opacity="0.9">

    <animateTransform
      attributeName="transform"
      type="translate"
      values="-5 0;5 0;-5 0"
      dur="10s"
      repeatCount="indefinite"/>
  </path>


  <!-- Small floating particles -->
  <g fill="#A8D58D">

    <circle cx="125" cy="180" r="2">
      <animate
        attributeName="cy"
        values="180;174;180"
        dur="4s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="330" cy="205" r="1.7">
      <animate
        attributeName="cy"
        values="205;199;205"
        dur="5s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="915" cy="165" r="2">
      <animate
        attributeName="cy"
        values="165;158;165"
        dur="4.5s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="1030" cy="195" r="1.5">
      <animate
        attributeName="cy"
        values="195;188;195"
        dur="5.5s"
        repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- TEXT -->
  <g text-anchor="middle"
     font-family="Arial, Helvetica, sans-serif">

    <!-- Name -->
    <text
      x="600"
      y="105"
      font-size="58"
      font-weight="700"
      fill="#FFFFFF">
      Joshua Serdan
    </text>

    <!-- Position -->
    <text
      x="600"
      y="145"
      font-size="24"
      font-weight="600"
      fill="#A8D58D">
      AI Automation Specialist &amp; Virtual Assistant
    </text>

    <!-- Divider -->
    <rect
      x="555"
      y="165"
      width="90"
      height="3"
      rx="2"
      fill="#8FBFA4"/>

    <!-- Tagline -->
    <text
      x="600"
      y="198"
      font-size="18"
      font-style="italic"
      fill="#C9DDB7">
      Building workflow systems that run quietly behind the scenes.
    </text>

  </g>

</svg>