<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#173F35"/>
      <stop offset="100%" stop-color="#2E6F52"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="260" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="24" fill="url(#grid)"/>

  <!-- Decorative automation nodes -->
  <g fill="none" stroke="#8FBFA4" stroke-width="2" opacity="0.45">
    <path d="M850 70 H930 L970 110 H1080"/>
    <path d="M900 190 H980 L1020 150 H1120"/>
  </g>

  <g fill="#8FBFA4">
    <circle cx="850" cy="70" r="5"/>
    <circle cx="930" cy="70" r="5"/>
    <circle cx="970" cy="110" r="5"/>
    <circle cx="1080" cy="110" r="5"/>
    <circle cx="900" cy="190" r="5"/>
    <circle cx="980" cy="190" r="5"/>
    <circle cx="1020" cy="150" r="5"/>
    <circle cx="1120" cy="150" r="5"/>
  </g>

  <!-- Main text -->
  <text x="90" y="105"
        font-family="Arial, Helvetica, sans-serif"
        font-size="52"
        font-weight="700"
        fill="#FFFFFF">
    Joshua Serdan
  </text>

  <text x="92" y="150"
        font-family="Arial, Helvetica, sans-serif"
        font-size="25"
        fill="#D9E9DF">
    AI Automation Specialist &amp; Virtual Assistant
  </text>

  <text x="92" y="195"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        fill="#AFCDBC">
    Building workflow systems that run quietly behind the scenes.
  </text>

  <!-- Small accent -->
  <rect x="92" y="215" width="80" height="4" rx="2" fill="#8FBFA4"/>
</svg>